[project]
name = "msr-build"
version = "0.1.0"
description = "MSR builder: the msr CLI, model builds, and corpus prep."
license = "LicenseRef-PolyForm-Strict-1.0.0"
authors = [{ name = "Karl Preisner" }]
requires-python = ">=3.14"
dependencies = ["msr-core", "msr-nlp", "msr-db"]

[project.scripts]
msr = "msr_build.cli:main"

[tool.uv.sources]
msr-core = { workspace = true }
msr-nlp = { workspace = true }
msr-db = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
