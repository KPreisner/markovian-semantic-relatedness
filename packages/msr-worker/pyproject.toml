[project]
name = "msr-worker"
version = "0.1.0"
description = "MSR Celery worker: concept and search jobs."
license = "LicenseRef-PolyForm-Strict-1.0.0"
authors = [{ name = "Karl Preisner" }]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "msr-core",
    "msr-db",
    "redis>=8.1.0",
    "structlog>=26.1.0",
]

[tool.uv.sources]
msr-core = { workspace = true }
msr-db = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
