[project]
name = "msr-api"
version = "0.1.0"
description = "MSR FastAPI service (REST + SSE)."
license = "LicenseRef-PolyForm-Strict-1.0.0"
authors = [{ name = "Karl Preisner" }]
requires-python = ">=3.14"
dependencies = ["msr-core", "msr-db"]

[tool.uv.sources]
msr-core = { workspace = true }
msr-db = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
