name: msr

# Every service loads both env files (see .env.static). Run through `task`, which runs
# `task validate` first and creates an empty .env if there is none.
x-env-files: &env-files
  env_file: [.env.static, .env]

# The Celery workers: one worker per container, running one task at a time (scale with more
# containers, MSR_*_WORKERS). A stop lets the running job finish first (warm shutdown).
x-worker: &worker
  image: msr-worker:latest
  <<: *env-files
  environment:
    MSR_DATA_DIR: /data
  networks: [backend]
  stop_grace_period: 30m
  healthcheck:
    test: ["CMD", "python", "-m", "msr_worker.healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  # The only published port (127.0.0.1:${MSR_WEB_PORT:-3000}). The Next.js UI and its BFF (/api/*,
  # which calls the API), plus the API itself under /fastapi/ with its docs at /fastapi/docs.
  web:
    image: msr-web:latest
    build:
      context: web
      target: prod
    <<: *env-files
    environment:
      MSR_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${MSR_WEB_PORT:-3000}:3000"
    networks: [frontend, backend]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: msr-db:latest
    build: database
    <<: *env-files
    volumes:
      # Postgres 18 images keep PGDATA in a version subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  # One-shot: applies database/migration/ and exits. Everything that uses Postgres waits for it.
  migrate:
    # Built by the postgres service: two services building one tag make each build replace the
    # other's image, which recreates postgres on every `compose build`.
    image: msr-db:latest
    pull_policy: never
    <<: *env-files
    environment:
      PGHOST: postgres
    command: ["/migration/migrate.sh"]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.4.0-management
    <<: *env-files
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/20-msr.conf:/etc/rabbitmq/conf.d/20-msr.conf:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:8.8.4-alpine
    <<: *env-files
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # FastAPI (REST + SSE). Stateless: no data/ mount, only Postgres, Redis, and the broker. Reached
  # from outside only through web, under /fastapi/ (hence --root-path).
  api:
    image: msr-api:latest
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: final
      args: {MEMBER: msr-api}
    <<: *env-files
    command:
      - uvicorn
      - --factory
      - msr_api.main:create_app
      - --host=0.0.0.0
      - --port=8000
      - --root-path=/fastapi
      - --no-access-log
      - --timeout-graceful-shutdown=15
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Concept jobs from the `cpu` queue: models/ mounted read-only, writes concepts/.
  # MSR_CPU_WORKERS containers (default 1).
  worker-cpu:
    <<: *worker
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: final
      args: {MEMBER: msr-worker}
    command:
      - celery
      - --app=msr_worker.app:celery_app
      - worker
      - --queues=cpu
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=50
      - --without-gossip
      - --without-heartbeat
      - --without-mingle
      - --loglevel=INFO
    volumes:
      - ${MSR_DATA_DIR:-./data}/models:/data/models:ro
      - ${MSR_DATA_DIR:-./data}/concepts:/data/concepts
    deploy:
      replicas: ${MSR_CPU_WORKERS:-1}

  # Search jobs from the `search` queue: corpora/ mounted read-only, writes searches/. No model is
  # ever loaded here. MSR_SEARCH_WORKERS containers (default 1).
  worker-search:
    <<: *worker
    # Built by worker-cpu: two services building one tag make each build replace the other's.
    pull_policy: never
    command:
      - celery
      - --app=msr_worker.app:celery_app
      - worker
      - --queues=search
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=50
      - --without-gossip
      - --without-heartbeat
      - --without-mingle
      - --loglevel=INFO
    volumes:
      - ${MSR_DATA_DIR:-./data}/corpora:/data/corpora:ro
      - ${MSR_DATA_DIR:-./data}/searches:/data/searches
    deploy:
      replicas: ${MSR_SEARCH_WORKERS:-1}

  # Run-and-exit: `task build:<stage> -- …` runs `docker compose run --rm builder msr …`.
  builder:
    image: msr-builder:latest
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: final
      args: {MEMBER: msr-build}
    profiles: [build]
    <<: *env-files
    command: ["msr", "--help"]
    environment:
      MSR_DATA_DIR: /data
    volumes:
      - ${MSR_DATA_DIR:-./data}:/data
    networks: [backend, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Node tooling for web/ (`task web:*`): npm, ESLint, Vitest, and type generation run here, not
  # on the host. node_modules lives in a named volume, so the host never gets Linux binaries.
  web-tools:
    image: node:24.22.1-alpine3.24
    profiles: [tools]
    working_dir: /app
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      # Next's build output and generated types stay in the container too.
      - /app/.next
    # npm needs the registry; nothing here talks to the backend.
    networks: [frontend]

  # Integration tests (`task py:test:integration`): the whole workspace with the source, tests,
  # and migrations mounted, on the backend network where Postgres, Redis, and RabbitMQ are
  # reachable. The tests create and drop their own scratch databases and queues.
  test:
    image: msr-test:latest
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: test
    profiles: [test]
    <<: *env-files
    environment:
      MSR_DATA_DIR: /tmp/data
    working_dir: /app
    command: ["pytest", "-m", "integration"]
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./packages:/app/packages
      - ./tests:/app/tests
      - ./database:/app/database:ro
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  web-node-modules:
  postgres-data:
  rabbitmq-data:
  redis-data:

networks:
  # web's published port.
  frontend:
  # Nothing on this network reaches the internet or is published to the host.
  backend:
    internal: true
  # Outbound access, for the builder's downloads only.
  egress:
