name: msr

# Every service loads both env files (see .env.static). Run through `task`, which runs
# `task validate` first and creates an empty .env if there is none.
x-env-files: &env-files
  env_file: [.env.static, .env]

services:
  postgres:
    image: msr-db:latest
    build: database
    <<: *env-files
    volumes:
      # Postgres 18 images keep PGDATA in a version subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  # One-shot: applies database/migration/ and exits. Everything that uses Postgres waits for it.
  migrate:
    # Built by the postgres service: two services building one tag make each build replace the
    # other's image, which recreates postgres on every `compose build`.
    image: msr-db:latest
    pull_policy: never
    <<: *env-files
    environment:
      PGHOST: postgres
    command: ["/migration/migrate.sh"]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.4.0-management
    <<: *env-files
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/20-msr.conf:/etc/rabbitmq/conf.d/20-msr.conf:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:8.8.4-alpine
    <<: *env-files
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Run-and-exit: `task build:<stage> -- …` runs `docker compose run --rm builder msr …`.
  builder:
    image: msr-builder:latest
    build:
      context: .
      dockerfile: docker/builder.Dockerfile
      target: final
    profiles: [build]
    <<: *env-files
    environment:
      MSR_DATA_DIR: /data
    volumes:
      - ${MSR_DATA_DIR:-./data}:/data
    networks: [backend, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Integration tests (`task py:test:integration`): the builder's develop image with the source,
  # tests, and migrations mounted, on the backend network where Postgres is reachable. The tests
  # create and drop their own scratch databases.
  test:
    image: msr-builder:develop
    build:
      context: .
      dockerfile: docker/builder.Dockerfile
      target: develop
    profiles: [test]
    <<: *env-files
    environment:
      MSR_DATA_DIR: /tmp/data
    working_dir: /app
    command: ["pytest", "-m", "integration"]
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./packages:/app/packages
      - ./tests:/app/tests
      - ./database:/app/database:ro
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:

networks:
  # Nothing on this network reaches the internet or is published to the host.
  backend:
    internal: true
  # Outbound access, for the builder's downloads only.
  egress:
