# The worker from source (`task dev:up:worker`): the develop target with packages/ bind-mounted,
# and Celery restarted whenever a .py file changes. A restart sends SIGTERM (a warm shutdown) and
# kills Celery 10 s later, so a job still running then is redelivered and runs again.
services:
  worker:
    image: msr-worker:develop
    build:
      target: develop
    entrypoint:
      - watchmedo
      - auto-restart
      - --directory=/app/packages
      - --pattern=*.py
      - --recursive
      - --signal=SIGTERM
      - --
    volumes:
      - ./packages:/app/packages
