# The API from source with hot reload (`task dev:up:api`): the develop target, packages/
# bind-mounted, and uvicorn --reload. Like the default, it's reached through web, with its docs at
# http://127.0.0.1:3000/fastapi/docs.
services:
  api:
    image: msr-api:develop
    build:
      target: develop
    command:
      - uvicorn
      - --factory
      - msr_api.main:create_app
      - --host=0.0.0.0
      - --port=8000
      - --root-path=/fastapi
      - --no-access-log
      - --reload
      - --reload-dir=/app/packages
    volumes:
      - ./packages:/app/packages
