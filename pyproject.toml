# Workspace root (not a package). Each member under packages/ is its own distribution;
# `uv sync` installs all of them into one dev environment from the shared uv.lock.
[project]
name = "markovian-semantic-relatedness"
version = "0.1.0"
description = "Markovian Semantic Relatedness (MSR): unsupervised, cross-language query expansion and ranked semantic search."
readme = "README.md"
authors = [{ name = "Karl Preisner" }]
requires-python = ">=3.14"
dependencies = ["msr-core", "msr-nlp", "msr-db", "msr-api", "msr-worker", "msr-build"]

[dependency-groups]
dev = ["ruff>=0.17", "mypy>=2.4", "pytest>=9.0", "hypothesis>=6.170", "scipy-stubs>=1.18"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
msr-core = { workspace = true }
msr-nlp = { workspace = true }
msr-db = { workspace = true }
msr-api = { workspace = true }
msr-worker = { workspace = true }
msr-build = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["packages/*/src", "."]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, N naming, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]
# Ambiguous-Unicode checks: the math uses ×, −, – as in the paper, and the data is bilingual.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["packages/*/src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
