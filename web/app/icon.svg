<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The MSR mark (components/site/logo.tsx), with the theme's colors written out in hex. -->
  <style>
    .stop-a { stop-color: #6e41db; }
    .stop-b { stop-color: #0085a0; }
    .node { fill: #fbfaf7; }
    .walker { fill: #0085a0; }
    @media (prefers-color-scheme: dark) {
      .stop-a { stop-color: #a98bff; }
      .stop-b { stop-color: #4ddae9; }
      .node { fill: #0a0c13; }
      .walker { fill: #4ddae9; }
    }
  </style>
  <defs>
    <linearGradient id="msr-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="stop-a" />
      <stop offset="1" class="stop-b" />
    </linearGradient>
  </defs>
  <path d="M7 22 L16 7 L25 21 Z" fill="none" stroke="url(#msr-logo)" stroke-width="2" stroke-linejoin="round" />
  <circle cx="7" cy="22" r="3.2" class="node" stroke="url(#msr-logo)" stroke-width="2" />
  <circle cx="16" cy="7" r="3.2" class="node" stroke="url(#msr-logo)" stroke-width="2" />
  <circle cx="25" cy="21" r="3.2" class="node" stroke="url(#msr-logo)" stroke-width="2" />
  <circle cx="20.5" cy="14" r="2" class="walker" />
</svg>
