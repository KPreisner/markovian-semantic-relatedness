name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest

  # The integration tests against Postgres, RabbitMQ, and Redis as service containers on
  # localhost (locally they run in the compose `test` container instead). The services' settings
  # match .env.static, which the tests read.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-local
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.4.0-management
        env:
          RABBITMQ_DEFAULT_USER: msr
          RABBITMQ_DEFAULT_PASS: rabbitmq-local
          RABBITMQ_DEFAULT_VHOST: msr
        # 15672: the management API, which the worker tests use for throwaway vhosts.
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: psql and envsubst (the migration runner)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client gettext-base
      - name: Environment from .env.static, pointed at the service containers
        run: |
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.static >> "$GITHUB_ENV"
          {
            echo "MSR_DB_HOST=localhost"
            echo "MSR_BROKER_HOST=localhost"
            echo "MSR_REDIS_URL=redis://localhost:6379/0"
            echo "MSR_DATA_DIR=/tmp/data"
          } >> "$GITHUB_ENV"
      - name: pytest -m integration
        run: uv run pytest -m integration

  # The end-to-end smoke test: the whole stack in Docker Compose (`task smoke`).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: arduino/setup-task@v2
        with:
          version: 3.51.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --locked
      - name: task smoke
        run: task smoke
