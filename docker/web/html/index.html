<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSR</title>
  <style>
    :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #5f6368; --bg: #fafafa; --link: #0b57d0; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8eaed; --muted: #9aa0a6; --bg: #17181a; --link: #8ab4f8; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
    p { color: var(--muted); }
    a { color: var(--link); }
    li { margin: 0.4rem 0; }
    code { font-size: 0.9em; }
  </style>
</head>
<body>
  <main>
    <h1>Markovian Semantic Relatedness</h1>
    <p>The stack is running. The UI isn't built yet; until it is, the API is here:</p>
    <ul>
      <li><a href="/fastapi/docs">API docs (Swagger UI)</a>: every endpoint, with "Try it out"</li>
      <li><a href="/fastapi/redoc">API reference (ReDoc)</a></li>
      <li><a href="/fastapi/openapi.json"><code>openapi.json</code></a></li>
    </ul>
  </main>
</body>
</html>
