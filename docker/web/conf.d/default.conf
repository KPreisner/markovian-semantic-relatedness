# The web placeholder until the Next.js UI (Phase 6): a holding page at /, and the FastAPI service
# under /fastapi/, so its OpenAPI docs (/fastapi/docs, /fastapi/redoc) and their "Try it out"
# calls work through the one published port. The API runs with `--root-path=/fastapi`, so the
# prefix is stripped here and its docs point back under it.
server {
    listen 80;
    server_name _;
    # Relative Location headers, so a redirect keeps the host port (the container listens on 80).
    absolute_redirect off;

    # Docker's DNS, re-resolved so a recreated api container (new IP) is found.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /fastapi {
        return 301 /fastapi/docs;
    }

    location /fastapi/ {
        rewrite ^/fastapi/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events: pass each event through as it comes, and let a stream stay open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
